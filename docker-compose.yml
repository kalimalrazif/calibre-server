# Full local stack: calibre-server (built from ./Dockerfile) behind nginx.
#
# Usage:
#   CALIBRE_LIBRARY=/path/to/your/Calibre docker compose up -d
# then open http://localhost:8088/calibre/html
#
# The library path is taken from the CALIBRE_LIBRARY env var (your Calibre
# library dir — the one containing metadata.db AND the author folders).

services:
  calibre-server:
    build: .
    # Reachable by nginx via the service name on the compose network; no host
    # port is published — only nginx is the public entrypoint.
    expose:
      - "8080"
    environment:
      # Must match nginx's /calibre/ location so OPDS links round-trip.
      BASE_URL: http://localhost:8088/calibre
    volumes:
      - "${CALIBRE_LIBRARY:?set CALIBRE_LIBRARY to your Calibre library path}:/library:ro"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - calibre-server
    ports:
      - "127.0.0.1:8088:80"   # loopback-only; front with real TLS on the host
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
