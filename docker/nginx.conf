# nginx config for the docker-compose stack.
#
# This is a SELF-CONTAINED, plain-HTTP front for local/dev use. It is NOT the
# production vhost — that lives in ../nginx-calibre.conf (SSL, certbot,
# auth_basic) and belongs on your real server. Add TLS/auth there, not here.
#
# Portability contract (same as production): the backend mounts at the ROOT;
# the trailing slash on proxy_pass strips "/calibre"; BASE_URL (set in
# docker-compose.yml) is the ONLY thing that tells the service its public
# prefix so it can emit root-relative links.

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Mounted under /calibre/. To serve at the root instead: replace this with
    #   location / { proxy_pass http://calibre-server:8080; ... }  (no trailing
    # slash) and set BASE_URL=http://localhost:8088  (no path) in compose.
    location /calibre/ {
        proxy_pass http://calibre-server:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Convenience: redirect bare / to the app.
    location = / {
        return 302 /calibre/html;
    }
}
