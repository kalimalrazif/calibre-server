server {
        listen 9080  ssl;
        listen [::]:9080  ssl;
        include snippets/self-signed.conf;
        include snippets/ssl-params.conf;
        server_tokens off;

        root /var/www/html;

        index index.html index.htm index.nginx-debian.html;
        server_name your-domain.example.com; # managed by Certbot

        location / {
                try_files $uri $uri/ =404;
        }

        # Calibre OPDS/Web Server, mounted under /cops/.
        #
        # Portability contract (works at / or at any /subpath/):
        #   * The service always mounts its routes at the ROOT (/books, /html,
        #     /opds, ...). It does NOT know its public prefix.
        #   * The trailing slash on proxy_pass below STRIPS "/cops" so the
        #     backend sees "/books", not "/cops/books".
        #   * The ONLY thing that tells the service its public prefix is the
        #     BASE_URL env var, which must match this location, e.g.:
        #         BASE_URL=https://your-domain.example.com:9080/cops
        #     With it, the service emits root-relative links ("/cops/books")
        #     that round-trip back through this block.
        #
        # To serve at the root instead: move these directives into `location /`,
        # use `proxy_pass http://127.0.0.1:8080;` (no trailing slash), and set
        # BASE_URL=https://host  (no path). No code change needed.
        location /cops/ {
                auth_basic "Calibre Library";
                auth_basic_user_file /etc/nginx/contrasenas;

                proxy_pass http://127.0.0.1:8080/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ /\.ht {
                deny all;
        }

    ssl_certificate /etc/letsencrypt/live/your-domain.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem; # managed by Certbot
}
